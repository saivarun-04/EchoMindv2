<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — EchoMind</title>
<style>
:root{--bg:#f6f6f2;--card:#fff;--ink:#16191f;--mute:#5d6470;--line:#e2e2da;--accent:#0b5d63;--accent-d:#08474c;--tint:#e6f1f1;--bad:#a4261f;--bad-t:#fceceb;--r:12px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header.top{border-bottom:1px solid var(--line);background:var(--card)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;max-width:1120px;margin:0 auto;padding:0 20px}
.logo{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-weight:700;font-size:20px;text-decoration:none;color:inherit}
.logo i{width:26px;height:26px;border-radius:50%;border:3px solid var(--accent);box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 9px var(--accent);display:block}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px;width:100%;max-width:420px;box-shadow:0 4px 16px rgba(0,0,0,0.04)}
h1{font-family:Georgia,"Iowan Old Style",serif;font-size:28px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 24px;font-size:15px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
input[type=email],input[type=password]{width:100%;border:1px solid #c9c9bf;border-radius:8px;padding:12px 14px;background:#fff;font:inherit;margin-bottom:16px}
input:focus{outline:3px solid #2b8c94;outline-offset:2px}
.btn{width:100%;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;font-size:16px;cursor:pointer;min-height:46px;margin-top:6px}
.btn:hover{background:var(--accent-d)}
.btn[disabled]{opacity:.6;cursor:progress}
.note{border-radius:8px;padding:11px 14px;font-size:14px;margin-bottom:16px}
.note.err{background:var(--bad-t);color:var(--bad)}
.note.ok{background:var(--tint);color:var(--accent-d)}
.switch{text-align:center;margin-top:20px;font-size:14px;color:var(--mute)}
.switch a{color:var(--accent);font-weight:600;text-decoration:none}
.switch a:hover{text-decoration:underline}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/"><i></i>EchoMind</a>
</div></header>

<div class="main">
  <div class="card">
    <h1>Sign In</h1>
    <p class="sub">Access your audience intelligence workspace.</p>
    
    <div id="msg" role="alert" style="display:none"></div>

    <form id="signinForm">
      <div>
        <label for="email">Email address</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@company.com">
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" id="btn" class="btn">Sign In</button>
    </form>

    <div class="switch">
      Don't have an account? <a href="/signup">Create one</a>
    </div>
  </div>
</div>

<script>
// If already authenticated, redirect to dashboard
if (localStorage.getItem("echomind_token")) {
  window.location.replace("/");
}

const form = document.getElementById("signinForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");

form.onsubmit = async (e) => {
  e.preventDefault();
  msg.style.display = "none";
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Signing in…';

  try {
    const res = await fetch("/auth/signin", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      })
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.detail || data.error?.message || "Invalid email or password.");
    }
    // Store token and user
    localStorage.setItem("echomind_token", data.token);
    localStorage.setItem("echomind_user", JSON.stringify(data.user));
    window.location.replace("/");
  } catch (err) {
    msg.className = "note err";
    msg.textContent = err.message;
    msg.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign In";
  }
};
</script>
</body>
</html>
